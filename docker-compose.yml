services:
  serv-hrcore-db:
    image: postgres:16

    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - hrcore_db_data:/var/lib/postgresql/data
    networks:
      - hrcore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: hrcore_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hrcore-net

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    networks:
      - hrcore-net

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    depends_on:
      minio:
        condition: service_started
    entrypoint: ['/bin/sh', '/policy/minio-init.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    volumes:
      - ./docker/minio-app-policy.json:/policy/minio-app-policy.json:ro
      - ./docker/minio-init.sh:/policy/minio-init.sh:ro
    networks:
      - hrcore-net

  serv-hrcore-api:
    build:
      context: ./hrcore-api
      dockerfile: Dockerfile.dev

    restart: unless-stopped
    depends_on:
      serv-hrcore-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PG_DUMP_PATH: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE_PATH: /usr/lib/postgresql/16/bin/pg_restore
      PSQL_PATH: /usr/lib/postgresql/16/bin/psql
      DOCUMENT_S3_ENDPOINT: http://minio:9000
      DOCUMENT_S3_ACCESS_KEY: ${MINIO_APP_USER}
      DOCUMENT_S3_SECRET_KEY: ${MINIO_APP_PASSWORD}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./hrcore-api:/app
      - maven_cache:/root/.m2
      - ./backups:/storage/backups
    working_dir: /app
    networks:
      - hrcore-net


  serv-hrcore-web:
    build:
      context: ./hrcore-web
      dockerfile: Dockerfile.dev

    restart: unless-stopped
    depends_on:
      - serv-hrcore-api
    #Poll declara en package.json scripts start
    ports:
      - "${FRONTEND_PORT}:4200"
    volumes:
      - ./hrcore-web:/app
      - node_modules:/app/node_modules
    networks:
      - hrcore-net

volumes:
  hrcore_db_data:
  minio_data:
  maven_cache:
  node_modules:

networks:
  hrcore-net:
    # custom network name (avoid auto-generated compose name)
    name: hrcore-system_hrcore-net
    driver: bridge
